<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes — Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main class="container" id="checkout-page-body">
  <h1 style="padding-top:26px;">Checkout</h1>
  <div class="checkout-grid">
    <div class="form-card">
      <h3 style="margin-bottom:18px;">Shipping details</h3>
      <form id="checkout-form" novalidate>
        <div class="form-grid">
          <div class="field full">
            <div style="width:100%;">
              <label for="full-name">Full name</label>
              <input id="full-name" name="full-name" type="text" required placeholder="Ada Lovelace">
            </div>
          </div>
          <div class="field full">
            <div style="width:100%;">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required placeholder="ada@example.com">
            </div>
          </div>
          <div class="field full">
            <div style="width:100%;">
              <label for="address">Street address</label>
              <input id="address" name="address" type="text" required placeholder="12 Analytical Engine Ave">
            </div>
          </div>
          <div class="field">
            <div style="width:100%;">
              <label for="city">City</label>
              <input id="city" name="city" type="text" required placeholder="London">
            </div>
          </div>
          <div class="field">
            <div style="width:100%;">
              <label for="zip">Postal code</label>
              <input id="zip" name="zip" type="text" required placeholder="SW1A 1AA">
            </div>
          </div>
          <div class="field full">
            <div style="width:100%;">
              <label for="card">Card number (demo only — not charged)</label>
              <input id="card" name="card" type="text" required placeholder="4242 4242 4242 4242" maxlength="19">
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="place-order-btn">Place order</button>
      </form>
    </div>

    <div class="summary-card">
      <h3 style="margin-bottom:14px;">Order summary</h3>
      <div id="order-summary"></div>
    </div>
  </div>
</main>

<footer class="site-footer">Field Notes — a demo storefront built for a front-end internship capstone. No real products are sold here.</footer>

<div id="ui-root"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
